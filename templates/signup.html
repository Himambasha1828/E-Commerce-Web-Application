<!doctype html>
<html >
  <head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" integrity="sha384-dpuaG1suU0eT09tx5plTaGMLBsfDLzUCCUXOY2j/LSvXYuG6Bqs43ALlhIqAJVRb" crossorigin="anonymous">

    <title>login</title>
    <style>
        body{
            background-image: url('https://wallpaperaccess.com/full/1900857.jpg');
            background-repeat: no-repeat;
            background-size: cover;
        }
        form{
            background-color: #f2f2f28e;
        }
    </style>
  </head>
  <body>
        <div class="container mt-4 pt-4">
            <div class="row mt-4 pt-4">
                <div class="col-3"></div>
                <div class="col-6 mt-4 pt-4">
                    <form class="mt-4 p-4 text-center" method="post"> {% csrf_token %}
                        {% if msg %}
                        <div class="alert alert-warning" role="alert">

                            {{msg}}
                            <script>
                                setTimeout(()=>{
                                    document.querySelector('.alert').style.display='none';
                                },3000)
                            </script>
                          </div>
                        {% endif %}
                        <input class="form-control mt-4 mb-4" type="email" placeholder="user mail" name="mail">
                        <input class="form-control mt-4 mb-4" type="text" placeholder="user name" name="name">
                        <input class="form-control mt-4 mb-4" type="phno" placeholder="user contact" name="phno">
                        <input class="form-control mt-4 mb-4" type="password" placeholder="user password" name="pswd1">
                        <input class="form-control mt-4 mb-4" type="password" placeholder="user re-enter password" name="pswd2">
                        <button type="submit" class="btn btn-primary ">signup</button>
                        <a href="{% url 'login'%}"><button type="button" class="btn btn-warning ">login</button></a>
                    </form>
                </div>
                <div class="col-3"></div>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


  </body>
</html>
