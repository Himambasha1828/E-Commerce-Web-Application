{% extends "base.html"%}
{% block title %}SREEJA || ACCOUNT {% endblock %}
{% block page %}
<div class="container">
    <div class="user-account row bg-secondary mt-4 pt-4 ">
        <div class="col-4">
            <label for="profile-data" style="width: 100%; height: 100%;">
            <img src="{{user.image.url}}" class="profile-pic rounded-circle" id="output">
            </label>
        </div>
        <form class="col-8 form-data text-center" method="POST" enctype="multipart/form-data"> {% csrf_token %}
            <input type="file" hidden  id="profile-data" onchange="proimg()" name="img">
            <input class="form-control" value="{{user.name}}" name="name" >
            <input class="form-control mt-4" value="{{user.email}}" name="mail" >
            <input class="form-control mt-4" value="{{user.contact}}" name="phno" >
            <textarea class="form-control mt-4" name="add" >{{user.address}}</textarea>
            <a class="btn btn-danger mt-4" href="{% url 'account'%}">Back</a> <button class="btn btn-primary mt-4">save Changes</button>
        </form>
        
    </div>
</div>
<script>
    const proimg =()=>{
        const file = document.getElementById('profile-data').files[0];
        document.getElementById('output').src = URL.createObjectURL(file);
        
    }
</script>
{% endblock %}
